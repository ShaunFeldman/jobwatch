name: jobwatch
on:
  schedule:
    # Dead-man restart only: each successful run dispatches its own successor
    # (see "chain next run"), so coverage doesn't depend on this best-effort
    # scheduler. If the chain breaks (a run fails), the next cron slot that
    # actually fires restarts it.
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: require delivery secret
        env:
          DISCORD_WEBHOOK_FULLTIME: ${{ secrets.DISCORD_WEBHOOK_FULLTIME }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_FULLTIME" ]; then
            echo "::error::Repo secret DISCORD_WEBHOOK_FULLTIME is not set (Settings → Secrets and variables → Actions). Failing so alerts and ops notices aren't silently dropped."
            exit 1
          fi
      - run: pip install -r requirements.txt
      - name: validate configuration
        run: python watcher.py --check
      - name: restore state
        id: restore
        # state lives on the force-pushed `state` branch so main stays clean
        run: |
          # A transport/auth failure must not masquerade as a first run.
          remote_state=$(git ls-remote origin refs/heads/state)
          if [ -n "$remote_state" ]; then
            git fetch origin state --depth 1
            git show FETCH_HEAD:state.json > state.json
            python -c 'import json; json.load(open("state.json"))'
            echo "state restored from state branch"
          else
            echo "no state branch yet — first run seeds silently"
          fi
      - name: continuous polling with minute checkpoints
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DISCORD_WEBHOOK_APPLY_INTERN: ${{ secrets.DISCORD_WEBHOOK_APPLY_INTERN }}
          DISCORD_WEBHOOK_APPLY_FULLTIME: ${{ secrets.DISCORD_WEBHOOK_APPLY_FULLTIME }}
          DISCORD_WEBHOOK_INTERN: ${{ secrets.DISCORD_WEBHOOK_INTERN }}
          DISCORD_WEBHOOK_FULLTIME: ${{ secrets.DISCORD_WEBHOOK_FULLTIME }}
        run: |
          git config user.name "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          # Independent source schedules stay alive across slow fetches. Atomic
          # JSON snapshots are published every minute, including during polling.
          python watcher.py --run-for 1200 &
          collector=$!
          while kill -0 "$collector" 2>/dev/null; do
            sleep 60
            if ! bash .github/scripts/save-state.sh; then
              kill "$collector" 2>/dev/null || true
              wait "$collector" || true
              exit 1
            fi
          done
          wait "$collector"
          bash .github/scripts/save-state.sh
      - name: preserve state after an interrupted poll
        if: always() && steps.restore.outcome == 'success' && steps.poll.outcome != 'skipped'
        run: bash .github/scripts/save-state.sh
      - name: retain recovery snapshot
        if: failure() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jobwatch-state-recovery
          path: state.json
          retention-days: 7
      - name: chain next run
        if: success()
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/jobwatch.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "successor dispatched"
